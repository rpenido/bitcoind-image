name: keepalive

# GitHub disables scheduled workflows in public repos after 60 days without
# repository activity. Bitcoin Core often goes 3-4 months between releases, so
# a monthly commit keeps the weekly build schedule alive.

on:
  schedule:
    - cron: "5 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record activity
        run: |
          set -euo pipefail
          mkdir -p .github
          date -u +"last keepalive: %Y-%m-%dT%H:%M:%SZ" > .github/last-activity.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-activity.txt
          git diff --cached --quiet || git commit -m "chore: keep scheduled workflows enabled"
          git push
